    <main class="container">
        <h1> Памятка по безопасной коммуникации в интернете</h1>
        <p class="subtitle">Как говорить, чтобы диалог не кончился в суде</p>
        
        <div class="guide-warning">
            <span class="warning-icon">⚠️</span>
            <p><strong>Важно:</strong> Сообщение не отправлено. Напишите "Бурмалда" чтобы попробовать снова</p>
        </div>
        
        <div class="guide-category red">
            <h3>Что является угрозой?</h3>
            <h4>Вербальные средства выражения угрозы</h4>
            <table class="guide-table">
                <thead><tr><th>Форма</th><th>Пример</th></tr></thead>
                <tbody>
                    <tr><td>Лексические маркеры: языковые средства со сниженной окраской</td><td>«Вот курва старая!»</td></tr>
                    <tr><td>Повелительное наклонение</td><td>«Молчи!»</td></tr>
                    <tr><td>Глаголы физического воздействия</td><td>«бить»,«ударить»,«оторвать»</td></tr>
                    <tr><td>«Давай» + совместное действие</td><td>«Давай бросим курить»</td><td>Побуждение к совместным действиям</td></tr>
                </tbody>
            </table>
           
        </div>
        
        <div class="guide-category green">
            <h3>🟢 Как говорить безопасно?</h3>
            <table class="guide-table">
                <thead><tr><th>Вместо опасного</th><th>Лучше сказать</th></tr></thead>
                <tbody>
                    <tr><td>«Долой власть!»</td><td>«Я не согласен с политикой властей»</td></tr>
                    <tr><td>«Хватит терпеть!»</td><td>«Я считаю, что ситуация требует изменений»</td></tr>
                    <tr><td>«Наш долг — бороться»</td><td>«Я считаю важным отстаивать свою позицию»</td></tr>
                    <tr><td>«Давай выйдем на улицу»</td><td>«Я планирую выразить свою позицию»</td></tr>
                    <tr><td>«Ты сделаешь это!»</td><td>«Я предлагаю рассмотреть такой вариант»</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="guide-category blue">
            <h3> Перед тем как отправить, подумай!</h3>
            <ul class="checklist">
                <li>- Хотелось бы тебе, чтобы твои близкие получили такое же сообщение?</li>
                <li>- Соответствует ли твое сообщение УК и АК РФ?</li>
                <li>- Гордились бы тобой твои родители?</li>
                <li>- Если бы тебе пришло такое сообщение, спалось бы тебе спокойно?</li>
            </ul>
            <p class="checklist-note"><strong>Если хотя бы на один пункт ответ «Нет» — перефразируй.</strong></p>
        </div>
